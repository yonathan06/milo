# Local development only. Credentials below are not production secrets.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: milo
      POSTGRES_PASSWORD: milo_dev
      POSTGRES_DB: milo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milo -d milo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
